name: SEO apply
run-name: SEO card ${{ inputs.card }}
# Started by the DayStar dashboard when an approved page title/description card is accepted.
# Edits the plain-text title/description in src/, builds, checks the built page, then commits and pushes (which publishes through Cloudflare).
on:
  workflow_dispatch:
    inputs:
      card: { description: Queue card id, required: true }
      changes: { description: Base64 JSON of the approved change, required: true }
      dry_run: { description: 'true = build and check only, publish nothing', default: 'false' }
permissions:
  contents: write
concurrency: seo-apply
jobs:
  apply:
    runs-on: ubuntu-latest
    outputs:
      left: ${{ steps.apply.outputs.left }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Apply the change
        id: apply
        env:
          CHANGES: ${{ inputs.changes }}
          DRY: ${{ inputs.dry_run }}
        run: |
          echo "$CHANGES" | base64 -d > "$RUNNER_TEMP/changes.json"
          git config user.name "DayStar SEO"
          git config user.email "info@daystardigital.co"
          if [ "$DRY" = "true" ]; then FLAG="--dry-run"; else FLAG="--push"; fi
          # exit 3 = the text could not be placed and nothing was changed: finish normally so no failure email goes out
          code=0; python3 scripts/seo-apply.py --repo . --changes "$RUNNER_TEMP/changes.json" $FLAG || code=$?
          if [ "$code" = "3" ]; then echo "left=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit $code
  left:
    name: Left for a person
    needs: apply
    if: needs.apply.outputs.left == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "The publish job could not place this change. Nothing was changed on the site."
